<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <title>An empty ruled pad with a pencil waiting on it</title>
  <g transform="rotate(-2 240 180)">
    <rect x="124" y="64" width="240" height="258" fill="#C9D6BE"/>
    <rect x="110" y="50" width="240" height="258" fill="#D8C38D" stroke="#2B2F2C" stroke-width="2.5"/>
    <rect x="110" y="50" width="240" height="253" fill="#EEF2E6" stroke="#2B2F2C" stroke-width="2.5"/>
    <rect x="110" y="50" width="240" height="248" fill="#F7F8F0" stroke="#2B2F2C" stroke-width="2.5"/>
    <g stroke="#A9C2A4" stroke-width="2">
      <path d="M112 110H348M112 134H348M112 158H348M112 182H348M112 206H348M112 230H348M112 254H348M112 278H348"/>
      <path d="M140 82V296M145 82V296M250 82V296M300 82V296"/>
    </g>
    <rect x="110" y="50" width="240" height="32" fill="#2F5D46" stroke="#2B2F2C" stroke-width="2.5"/>
    <g fill="#2F5D46">
      <rect x="156" y="94" width="40" height="5"/><rect x="262" y="94" width="26" height="5"/><rect x="312" y="94" width="26" height="5"/>
    </g>
    <!-- the caret on the first line: nothing entered yet -->
    <rect x="156" y="114" width="3" height="16" fill="#2B2F2C"/>
  </g>

  <!-- the pencil, waiting -->
  <g transform="rotate(-24 290 270)">
    <polygon points="156,266 386,266 418,276 386,286 156,286" fill="#C9D6BE"/>
    <rect x="150" y="261" width="18" height="18" fill="#B3261E" stroke="#2B2F2C" stroke-width="2.5"/>
    <rect x="168" y="260" width="22" height="20" fill="#A9C2A4" stroke="#2B2F2C" stroke-width="2.5"/>
    <path d="M175.5 260V280M182.5 260V280" stroke="#2B2F2C" stroke-width="2"/>
    <rect x="190" y="260" width="190" height="20" fill="#D8C38D" stroke="#2B2F2C" stroke-width="2.5"/>
    <rect x="191.25" y="266.5" width="187.5" height="7" fill="#2F5D46"/>
    <polygon points="380,260 412,270 380,280" fill="#F7F8F0" stroke="#2B2F2C" stroke-width="2.5" stroke-linejoin="miter"/>
    <polygon points="401,266.6 412,270 401,273.4" fill="#2B2F2C"/>
  </g>
</svg>
