<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <title>Monthly purchase slips go into a ruled analysis pad, which fills Form 8621</title>
  <defs>
    <!-- One purchase slip (SIP contract note): manila stub, perforation, date, units, amount. -->
    <g id="slip">
      <rect x="0" y="0" width="290" height="90" fill="#F7F8F0" stroke="#2B2F2C" stroke-width="3"/>
      <rect x="1.5" y="1.5" width="62.5" height="87" fill="#D8C38D"/>
      <path d="M64 1.5V88.5" stroke="#2B2F2C" stroke-width="3" stroke-dasharray="6 5"/>
      <rect x="15" y="20" width="34" height="6" fill="#2F5D46"/>
      <rect x="15" y="34" width="22" height="6" fill="#2B2F2C"/>
      <rect x="82" y="20" width="70" height="6" fill="#2B2F2C"/>
      <rect x="82" y="36" width="120" height="5" fill="#A9C2A4"/>
      <path d="M82 50H250" stroke="#A9C2A4" stroke-width="2"/>
      <rect x="196" y="60" width="54" height="8" fill="#2B2F2C"/>
    </g>
  </defs>

  <g transform="translate(-18 -36)">
    <!-- 1. The input: a stack of monthly purchase slips, tucked under the pad's edge. -->
    <g>
      <rect x="0" y="0" width="290" height="90" fill="#C9D6BE" transform="translate(80 432) rotate(-3)"/>
      <use href="#slip" transform="translate(74 240) rotate(2)"/>
      <use href="#slip" transform="translate(68 276) rotate(-1)"/>
      <use href="#slip" transform="translate(76 312) rotate(3)"/>
      <use href="#slip" transform="translate(66 348) rotate(-2)"/>
      <use href="#slip" transform="translate(78 384) rotate(2)"/>
      <use href="#slip" transform="translate(70 420) rotate(-3)"/>
    </g>

    <!-- 2. The pad: lots in rows, spread across five year columns, totals closed with the red double rule. -->
    <g transform="rotate(-3 610 370)">
      <rect x="364" y="124" width="520" height="534" fill="#C9D6BE"/>
      <rect x="350" y="110" width="520" height="534" fill="#D8C38D" stroke="#2B2F2C" stroke-width="3"/>
      <rect x="350" y="110" width="520" height="526" fill="#EEF2E6" stroke="#2B2F2C" stroke-width="3"/>
      <rect x="350" y="110" width="520" height="520" fill="#F7F8F0" stroke="#2B2F2C" stroke-width="3"/>

      <!-- column head band for the selected tax year -->
      <rect x="763.5" y="155.5" width="61" height="33" fill="#D8C38D"/>

      <!-- ruling -->
      <g stroke="#A9C2A4" stroke-width="2">
        <path d="M352 190H868M352 222H868M352 254H868M352 286H868M352 318H868M352 350H868M352 382H868M352 414H868M352 446H868M352 478H868M352 510H506M352 574H868M352 606H868"/>
        <path d="M404 154V628M410 154V628"/>
        <path d="M506 154V628M570 154V628M634 154V628M698 154V628M762 154V628M826 154V628"/>
      </g>

      <!-- binding band -->
      <rect x="350" y="110" width="520" height="44" fill="#2F5D46" stroke="#2B2F2C" stroke-width="3"/>
      <rect x="351.5" y="144" width="517" height="6" fill="#1F3F30"/>

      <!-- column heads -->
      <rect x="420" y="168" width="52" height="6" fill="#2F5D46"/>
      <rect x="522" y="168" width="32" height="6" fill="#2F5D46"/>
      <rect x="586" y="168" width="32" height="6" fill="#2F5D46"/>
      <rect x="650" y="168" width="32" height="6" fill="#2F5D46"/>
      <rect x="714" y="168" width="32" height="6" fill="#2F5D46"/>
      <rect x="778" y="168" width="32" height="6" fill="#2B2F2C"/>

      <!-- lot dates -->
      <g fill="#2B2F2C">
        <rect x="420" y="203" width="52" height="6"/>
        <rect x="420" y="235" width="52" height="6"/>
        <rect x="420" y="267" width="52" height="6"/>
        <rect x="420" y="299" width="52" height="6"/>
        <rect x="420" y="331" width="52" height="6"/>
        <rect x="420" y="363" width="52" height="6"/>
        <rect x="420" y="395" width="52" height="6"/>
        <rect x="420" y="427" width="52" height="6"/>
        <rect x="420" y="459" width="52" height="6"/>
      </g>

      <!-- prior-year portions: the staircase of SIP lots -->
      <g fill="#2B2F2C">
        <rect x="524" y="203" width="38" height="6"/><rect x="586" y="203" width="40" height="6"/><rect x="654" y="203" width="36" height="6"/><rect x="714" y="203" width="40" height="6"/>
        <rect x="532" y="235" width="30" height="6"/><rect x="586" y="235" width="40" height="6"/><rect x="652" y="235" width="38" height="6"/><rect x="714" y="235" width="40" height="6"/>
        <rect x="590" y="267" width="36" height="6"/><rect x="650" y="267" width="40" height="6"/><rect x="716" y="267" width="38" height="6"/>
        <rect x="598" y="299" width="28" height="6"/><rect x="652" y="299" width="38" height="6"/><rect x="714" y="299" width="40" height="6"/>
        <rect x="656" y="331" width="34" height="6"/><rect x="714" y="331" width="40" height="6"/>
        <rect x="664" y="363" width="26" height="6"/><rect x="716" y="363" width="38" height="6"/>
        <rect x="722" y="395" width="32" height="6"/>
        <rect x="730" y="427" width="24" height="6"/>
      </g>

      <!-- current-year portions (ordinary income) in ledger green -->
      <g fill="#2F5D46">
        <rect x="788" y="203" width="30" height="6"/>
        <rect x="790" y="235" width="28" height="6"/>
        <rect x="792" y="267" width="26" height="6"/>
        <rect x="794" y="299" width="24" height="6"/>
        <rect x="792" y="331" width="26" height="6"/>
        <rect x="796" y="363" width="22" height="6"/>
        <rect x="794" y="395" width="24" height="6"/>
        <rect x="798" y="427" width="20" height="6"/>
        <rect x="800" y="459" width="18" height="6"/>
      </g>

      <!-- totals: single graphite rule above, red double rule below -->
      <path d="M506 510H826" stroke="#2B2F2C" stroke-width="3"/>
      <rect x="366" y="521" width="28" height="6" fill="#2F5D46"/>
      <rect x="420" y="521" width="40" height="6" fill="#2F5D46"/>
      <g fill="#2B2F2C">
        <rect x="518" y="520" width="44" height="8"/>
        <rect x="576" y="520" width="50" height="8"/>
        <rect x="636" y="520" width="54" height="8"/>
        <rect x="698" y="520" width="56" height="8"/>
      </g>
      <rect x="776" y="520" width="42" height="8" fill="#2F5D46"/>
      <path d="M506 545H826M506 552H826" stroke="#B3261E" stroke-width="3"/>
    </g>

    <!-- 3. The result: Form 8621, its boxes filled. -->
    <g transform="rotate(1.5 1002 395)">
      <rect x="862" y="182" width="304" height="450" fill="#C9D6BE"/>
      <rect x="850" y="170" width="304" height="450" fill="#F7F8F0" stroke="#2B2F2C" stroke-width="3"/>

      <!-- header: form number box, title, year box -->
      <rect x="862" y="184" width="28" height="5" fill="#2B2F2C"/>
      <g fill="none" stroke="#2B2F2C" stroke-width="3.5" stroke-linecap="square">
        <circle cx="870" cy="209" r="7"/>
        <circle cx="870" cy="224.5" r="8.5"/>
        <circle cx="890" cy="224.5" r="8.5"/>
        <path d="M881.5 224Q882 203.5 896 202.5"/>
        <path d="M903 208C903 203 917 201 917 209C917 216 903 226 903 233H917"/>
        <path d="M925 207L931 202V233M925 233H937"/>
      </g>
      <path d="M946 170V250M1080 170V250" stroke="#2B2F2C" stroke-width="3"/>
      <rect x="960" y="188" width="104" height="7" fill="#2B2F2C"/>
      <rect x="960" y="205" width="90" height="5" fill="#A9C2A4"/>
      <rect x="960" y="217" width="70" height="5" fill="#A9C2A4"/>
      <rect x="960" y="229" width="82" height="5" fill="#A9C2A4"/>
      <rect x="1092" y="190" width="44" height="5" fill="#A9C2A4"/>
      <rect x="1092" y="204" width="34" height="5" fill="#A9C2A4"/>
      <rect x="1092" y="224" width="50" height="9" fill="#2B2F2C"/>
      <rect x="850" y="248" width="304" height="5" fill="#2B2F2C"/>

      <!-- name and identifying number -->
      <rect x="862" y="262" width="60" height="4" fill="#A9C2A4"/>
      <rect x="862" y="272" width="124" height="6" fill="#2B2F2C"/>
      <rect x="1052" y="262" width="50" height="4" fill="#A9C2A4"/>
      <rect x="1052" y="272" width="82" height="6" fill="#2B2F2C"/>
      <path d="M1040 253V286" stroke="#2B2F2C" stroke-width="2"/>
      <path d="M850 286H1154" stroke="#2B2F2C" stroke-width="2"/>

      <!-- Part bar -->
      <rect x="850" y="300" width="62" height="18" fill="#2B2F2C"/>
      <rect x="862" y="306" width="36" height="6" fill="#F7F8F0"/>
      <rect x="924" y="306" width="150" height="6" fill="#2B2F2C"/>
      <path d="M850 318H1154" stroke="#2B2F2C" stroke-width="2"/>

      <!-- lines with amount boxes -->
      <g stroke-width="2">
        <path d="M850 348H1066M850 378H1066M850 408H1066M850 438H1066M850 468H1066M850 498H1066" stroke="#A9C2A4"/>
        <path d="M1066 348H1154M1066 378H1154M1066 408H1154M1066 438H1154M1066 468H1154M1066 498H1154M1066 528H1154M1066 318V528M1090 318V528" stroke="#2B2F2C"/>
      </g>
      <g fill="#2F5D46">
        <rect x="860" y="330" width="20" height="6"/><rect x="860" y="360" width="20" height="6"/><rect x="860" y="390" width="20" height="6"/><rect x="860" y="420" width="20" height="6"/><rect x="860" y="450" width="20" height="6"/><rect x="860" y="480" width="20" height="6"/><rect x="860" y="510" width="20" height="6"/>
        <rect x="1072" y="330" width="12" height="6"/><rect x="1072" y="360" width="12" height="6"/><rect x="1072" y="390" width="12" height="6"/><rect x="1072" y="420" width="12" height="6"/><rect x="1072" y="450" width="12" height="6"/><rect x="1072" y="480" width="12" height="6"/><rect x="1072" y="510" width="12" height="6"/>
      </g>
      <g fill="#A9C2A4">
        <rect x="890" y="330" width="120" height="5"/><rect x="890" y="360" width="96" height="5"/><rect x="890" y="390" width="130" height="5"/><rect x="890" y="420" width="104" height="5"/><rect x="890" y="450" width="118" height="5"/><rect x="890" y="480" width="88" height="5"/><rect x="890" y="510" width="110" height="5"/>
      </g>
      <g fill="#2B2F2C">
        <rect x="1100" y="329" width="44" height="7"/><rect x="1108" y="359" width="36" height="7"/><rect x="1096" y="389" width="48" height="7"/><rect x="1104" y="419" width="40" height="7"/><rect x="1104" y="449" width="40" height="7"/><rect x="1114" y="479" width="30" height="7"/><rect x="1092" y="509" width="52" height="7"/>
      </g>

      <!-- second Part, continuing -->
      <rect x="850" y="540" width="62" height="18" fill="#2B2F2C"/>
      <rect x="862" y="546" width="36" height="6" fill="#F7F8F0"/>
      <rect x="924" y="546" width="120" height="6" fill="#2B2F2C"/>
      <path d="M850 558H1154" stroke="#2B2F2C" stroke-width="2"/>
      <path d="M850 588H1066" stroke="#A9C2A4" stroke-width="2"/>
      <path d="M1066 588H1154M1066 558V618M1090 558V618" stroke="#2B2F2C" stroke-width="2"/>
      <rect x="860" y="570" width="20" height="6" fill="#2F5D46"/>
      <rect x="890" y="570" width="110" height="5" fill="#A9C2A4"/>
      <rect x="860" y="600" width="20" height="6" fill="#2F5D46"/>
      <rect x="890" y="600" width="84" height="5" fill="#A9C2A4"/>

      <!-- the red-pencil circle around the line carried from the pad -->
      <path d="M1098 445C1110 437 1146 437 1150 450C1153 462 1118 468 1100 463C1090 459 1091 450 1104 444" fill="none" stroke="#B3261E" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 4. The pencil that drew the double rule. -->
    <g transform="translate(0 -10) rotate(-16 540 628)">
      <polygon points="338,626 708,626 754,640 708,654 338,654" fill="#C9D6BE"/>
      <rect x="330" y="616" width="24" height="24" fill="#B3261E" stroke="#2B2F2C" stroke-width="3"/>
      <rect x="354" y="614" width="30" height="28" fill="#A9C2A4" stroke="#2B2F2C" stroke-width="3"/>
      <path d="M364 614V642M374 614V642" stroke="#2B2F2C" stroke-width="2"/>
      <rect x="384" y="614" width="316" height="28" fill="#D8C38D" stroke="#2B2F2C" stroke-width="3"/>
      <rect x="385.5" y="623" width="313" height="10" fill="#2F5D46"/>
      <polygon points="700,614 746,628 700,642" fill="#F7F8F0" stroke="#2B2F2C" stroke-width="3" stroke-linejoin="miter"/>
      <polygon points="730,623.1 746,628 730,632.9" fill="#2B2F2C"/>
    </g>

    <!-- 5. The red-pencil arrow carrying the total to the form line. -->
    <path d="M812 560C880 576 1000 540 1082 462" fill="none" stroke="#B3261E" stroke-width="3" stroke-linecap="round"/>
    <path d="M1066.4 465.7L1082 462L1077.5 477.4" fill="none" stroke="#B3261E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
